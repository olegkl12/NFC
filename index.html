<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC Smart System</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
  }
  body {
    min-height: 100vh;
    background: #0b0d12;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
    position: relative;
  }
  #watermark {
    position: fixed;
    top: -40%;
    left: -40%;
    width: 180%;
    height: 180%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: center;
    gap: 40px 55px;
    transform: rotate(-25deg);
    pointer-events: none;
    z-index: 0;
    user-select: none;
    filter: blur(2px);
  }
  .wm-item {
    font-size: 56px;
    font-weight: 900;
    color: rgba(255, 255, 255, 0.07);
    letter-spacing: 5px;
  }
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 390px;
    background: rgba(24, 27, 34, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
  }
  h2 {
    font-size: 21px;
    text-align: center;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 13px;
    color: #9ca3af;
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.4;
  }
  label {
    display: block;
    font-size: 12px;
    color: #9ca3af;
    margin: 11px 0 4px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #353b47;
    background: #0f1115;
    color: #ffffff;
    font-size: 14px;
    outline: none;
  }
  input:focus {
    border-color: #24A1DE;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    margin-top: 12px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-white { background: #ffffff; color: #000000; margin-top: 18px; }
  .btn-blue { background: #24A1DE; color: #ffffff; }
  .btn-gray { background: #2e333d; color: #ffffff; }
  .btn-yandex { background: #ffcc00; color: #000000; }
  .btn-2gis { background: #2ab930; color: #ffffff; }
  .btn-insta { background: #dc2743; color: #ffffff; }
  .logo-box {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: #2b303b;
    margin: 0 auto 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    font-weight: bold;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.2);
  }
  .logo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .result-panel {
    margin-top: 18px;
    padding: 14px;
    background: #14222e;
    border: 1px solid #24A1DE;
    border-radius: 14px;
    display: none;
  }
  .footer {
    margin-top: 22px;
    text-align: center;
    font-size: 11px;
    color: #5c6270;
  }
</style>
</head>
<body>

<div id="watermark"></div>

<div class="card" id="mainCard">
  <div id="editorBlock">
    <h2>Генератор NFC-карты</h2>
    <p class="subtitle">Заполните нужные поля — пустые кнопки скроются</p>

    <label>Название заведения *</label>
    <input type="text" id="fName" placeholder="Например: Кофейня Бодрость">

    <label>Прямая ссылка на логотип (необязательно)</label>
    <input type="text" id="fImg" placeholder="https://... (.jpg или .png)">

    <label>Текст под названием</label>
    <input type="text" id="fSub" value="Спасибо, что выбрали нас! Оставьте отзыв или подпишитесь">

    <label>Отзывы Яндекс Карты (необязательно)</label>
    <input type="text" id="fYa" placeholder="https://yandex.ru...">

    <label>Отзывы 2ГИС (необязательно)</label>
    <input type="text" id="fDg" placeholder="https://2gis.com...">

    <label>Telegram (необязательно)</label>
    <input type="text" id="fTg" placeholder="https://t.me...">

    <label>Instagram (необязательно)<


el>
    <input type="text" id="fIg" placeholder="https://instagram.com...">

    <button type="button" class="btn btn-white" id="btnCreate">Создать ссылку</button>

    <div class="result-panel" id="resPanel">
      <label style="color: #ffffff; margin-top: 0; text-align: center;">Готовая ссылка для NFC:</label>
      <input type="text" id="outLink" readonly style="color: #7dd3fc; text-align: center;">
      <button type="button" class="btn btn-blue" id="btnCopy">Скопировать ссылку</button>
      <a class="btn btn-gray" id="btnPreview" target="_blank">Открыть карточку клиента</a>
    </div>
  </div>

  <div id="clientBlock" style="display: none; text-align: center;">
    <div class="logo-box" id="cLogo"></div>
    <h2 id="cTitle"></h2>
    <p class="subtitle" id="cSub"></p>
    <div id="cButtons"></div>
  </div>

  <div class="footer">NFC SMART SYSTEM</div>
</div>

<script>
  var wm = document.getElementById('watermark');
  for (var i = 0; i < 70; i++) {
    var span = document.createElement('span');
    span.className = 'wm-item';
    span.textContent = 'NFC';
    wm.appendChild(span);
  }

  var params = new URLSearchParams(window.location.search);
  var clientName = params.get('n');

  if (clientName) {
    document.getElementById('editorBlock').style.display = 'none';
    document.getElementById('clientBlock').style.display = 'block';
    document.title = clientName;
    document.getElementById('cTitle').textContent = clientName;

    var subText = params.get('s');
    if (subText) {
      document.getElementById('cSub').textContent = subText;
    }

    var logoBox = document.getElementById('cLogo');
    var imgUrl = params.get('img');
    if (imgUrl) {
      var img = document.createElement('img');
      img.src = imgUrl;
      img.onerror = function() {
        logoBox.textContent = clientName.trim().substring(0, 2).toUpperCase();
      };
      logoBox.appendChild(img);
    } else {
      logoBox.textContent = clientName.trim().substring(0, 2).toUpperCase();
    }

    var btnContainer = document.getElementById('cButtons');
    function makeButton(paramKey, labelText, cssClass) {
      var url = params.get(paramKey);
      if (url && url.trim() !== '') {
        var link = document.createElement('a');
        link.href = url;
        link.className = 'btn ' + cssClass;
        link.target = '_blank';
        link.textContent = labelText;
        btnContainer.appendChild(link);
      }
    }

    makeButton('ya', 'Оставить отзыв в Яндекс Картах', 'btn-yandex');
    makeButton('dg', 'Оценить нас в 2ГИС', 'btn-2gis');
    makeButton('tg', 'Наш Telegram-канал', 'btn-blue');
    makeButton('ig', 'Наш Instagram', 'btn-insta');
  }

  document.getElementById('btnCreate').onclick = function() {
    var nameVal = document.getElementById('fName').value.trim();
    if (!nameVal) {
      alert('Введите название заведения!');
      return;
    }

    var base = window.location.origin + window.location.pathname;
    var resultUrl = new URL(base);
    resultUrl.searchParams.set('n', nameVal);

    var fields = 'img,s,ya,dg,tg,ig'.split(',');
    var ids = 'fImg,fSub,fYa,fDg,fTg,fIg'.split(',');

    for (var j = 0; j < fields.length; j++) {
      var val = document.getElementById(ids[j]).value.trim();
      if (val !== '') {
        resultUrl.searchParams.set(fields[j], val);
      }
    }

    var finalStr = resultUrl.toString();
    document.getElementById('outLink').value = finalStr;
    document.getElementById('btnPreview').href = finalStr;
    document.getElementById('resPanel').style.display = 'block';
  };

  document.getElementById('btnCopy').onclick = function() {
    var input = document.getElementById('outLink');
    input.select();
    input.setSelectionRange(0, 99999);
    document.execCommand('copy');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(input.value);
    }
    alert('Ссылка скопирована!');
  };
</script>
</body>
</html>/lab
