<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC Smart System</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body {
    min-height: 100vh;
    background-color: #0b0d12;
    background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='200' height='200'%3E%3Ctext x='50%25' y='50%25' font-family='Arial' font-weight='900' font-size='46' fill='rgba(255,255,255,0.08)' text-anchor='middle' dominant-baseline='middle' transform='rotate(-30 100 100)'%3ENFC%3C/text%3E%3C/svg%3E");
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .box {
    width: 100%;
    max-width: 380px;
    background: rgba(24, 27, 34, 0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 28px 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
  }
  h2 { font-size: 20px; text-align: center; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #9ca3af; text-align: center; margin-bottom: 18px; }
  label { display: block; font-size: 12px; color: #9ca3af; margin: 10px 0 4px; }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #353b47;
    background: #0f1115;
    color: #fff;
    font-size: 14px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-w { background: #fff; color: #000; }
  .btn-b { background: #24A1DE; color: #fff; }
  .btn-g { background: #2e333d; color: #fff; }
  .btn-ya { background: #ffcc00; color: #000; }
  .btn-2g { background: #2ab930; color: #fff; }
  .btn-ig { background: #dc2743; color: #fff; }
  .logo {
    width: 80px; height: 80px; border-radius: 50%; background: #2b303b;
    margin: 0 auto 14px; display: flex; justify-content: center; align-items: center;
    font-size: 26px; font-weight: bold; overflow: hidden; border: 2px solid rgba(255,255,255,0.2);
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .res { margin-top: 16px; padding: 12px; background: #14222e; border-radius: 12px; display: none; }
</style>
</head>
<body>

<div class="box" id="app">
  <h2>Генератор NFC-карты</h2>
  <p class="sub">Заполните нужные поля — пустые кнопки скроются</p>

  <label>Название заведения *</label>
  <input id="n" placeholder="Например: BREND SHOP">

  <label>Прямая ссылка на логотип (.jpg / .png)</label>
  <input id="img" placeholder="Необязательно">

  <label>Текст под названием</label>
  <input id="s" value="Спасибо, что выбрали нас! Оставьте отзыв или подпишитесь">

  <label>Отзывы Яндекс Карты</label>
  <input id="ya" placeholder="https://yandex.ru...">

  <label>Отзывы 2ГИС</label>
  <input id="dg" placeholder="https://2gis.com...">

  <label>Telegram</label>
  <input id="tg" placeholder="https://t.me...">

  <label>Instagram</label>
  <input id="ig" placeholder="https://instagram.com...">

  <button class="btn btn-w" onclick="make()">Создать ссылку</button>

  <div class="res" id="res">
    <label style="color:#fff;margin-top:0">Готовая ссылка для NFC:</label>
    <input id="out" readonly style="color:#7dd3fc;text-align:center">
    <button class="btn btn-b" onclick="cp()">Скопировать ссылку</button>
    <a class="btn btn-g" id="lnk" target="_blank">Открыть карточку клиента</a>
  </div>
</div>

<script>
var q = new URLSearchParams(location.search);
if (q.get('n')) {
  var name = q.get('n');
  document.title = name;
  var logo = q.get('img') ? '<img src="' + q.get('img') + '">' : name.slice(0,2).toUpperCase();
  var html = '<div class="logo">' + logo + '</div>';
  html += '<h2>' + name + '</h2>';
  html += '<p class="sub">' + (q.get('s') || '') + '</p>';
  if (q.get('ya')) html += '<a class="btn btn-ya" href="' + q.get('ya') + '" target="_blank">★ Оставить отзыв в Яндекс


/a>';
  if (q.get('dg')) html += '<a class="btn btn-2g" href="' + q.get('dg') + '" target="_blank">★ Оценить нас в 2ГИС</a>';
  if (q.get('tg')) html += '<a class="btn btn-b" href="' + q.get('tg') + '" target="_blank">Наш Telegram-канал</a>';
  if (q.get('ig')) html += '<a class="btn btn-ig" href="' + q.get('ig') + '" target="_blank">Наш Instagram</a>';
  document.getElementById('app').innerHTML = html;
}

function make() {
  var name = document.getElementById('n').value.trim();
  if (!name) return alert('Введите название!');
  var u = new URL(location.origin + location.pathname);
  'n,img,s,ya,dg,tg,ig'.split(',').forEach(function(id) {
    var v = document.getElementById(id).value.trim();
    if (v) u.searchParams.set(id, v);
  });
  var final = u.toString();
  document.getElementById('out').value = final;
  document.getElementById('lnk').href = final;
  document.getElementById('res').style.display = 'block';
}

function cp() {
  var el = document.getElementById('out');
  el.select();
  document.execCommand('copy');
  alert('Скопировано!');
}
</script>
</body>
</html> Картах<
