<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NFC Smart System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 20% 10%,#1c2235 0%,#090b10 75%);color:#fff;display:flex;justify-content:center;align-items:center;padding:16px;overflow-x:hidden;position:relative}
#wm{position:fixed;inset:-50%;width:200%;height:200%;display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));align-content:center;justify-items:center;gap:26px 16px;transform:rotate(-26deg);pointer-events:none;z-index:0;user-select:none;filter:blur(2px)}
#wm span{font-size:24px;font-weight:900;color:rgba(255,255,255,.055);letter-spacing:4px}
.card{position:relative;z-index:1;width:100%;max-width:390px;background:rgba(20,23,30,.9);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:30px 22px;box-shadow:0 28px 60px rgba(0,0,0,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
h2{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px}
.sub{font-size:13.5px;color:#9ca3af;text-align:center;margin-bottom:22px;line-height:1.4}
label{display:block;font-size:12px;color:#9ca3af;margin:11px 0 4px}
input{width:100%;padding:12px 14px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:rgba(11,13,18,.9);color:#fff;font-size:14px;outline:none}
input:focus{border-color:#38bdf8}
.btn{display:block;width:100%;padding:14px;margin-top:14px;border:none;border-radius:15px;font-size:15px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.btn-w{background:#fff;color:#090b10}
.btn-b{background:#0ea5e9;color:#fff}
.btn-g{background:rgba(255,255,255,.1);color:#fff}
.logo{width:88px;height:88px;border-radius:50%;background:linear-gradient(145deg,#2b3142,#151821);margin:0 auto 16px;display:flex;justify-content:center;align-items:center;font-size:30px;font-weight:800;overflow:hidden;border:2px solid rgba(255,255,255,.25);box-shadow:0 10px 25px rgba(0,0,0,.5)}
.logo img{width:100%;height:100%;object-fit:cover}
.abtn{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;margin-top:12px;border-radius:19px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.35);text-align:left}
.ico{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;justify-content:center;align-items:center;font-size:19px;flex-shrink:0}
.stars{font-size:10px;letter-spacing:2px;margin-bottom:2px}
.lbl{font-size:15px;font-weight:700;line-height:1.2}
.t-ya{background:linear-gradient(135deg,#ffd60a,#f59e0b);color:#111}
.t-dg{background:linear-gradient(135deg,#34d399,#16a34a);color:#fff}
.t-tg{background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff}
.t-ig{background:linear-gradient(135deg,#f97316,#e11d48,#9333ea);color:#fff}
.res{margin-top:16px;padding:14px;background:rgba(14,165,233,.12);border:1px solid rgba(56,189,248,.4);border-radius:15px;display:none}
.ft{margin-top:24px;text-align:center;font-size:11px;color:#64748b;letter-spacing:1.2px;font-weight:600}
</style>
</head>
<body>
<div id="wm"></div>
<div class="card">
<div id="v-auth">
<h2>🔒 Доступ закрыт</h2>
<p class="sub">Введите пароль администратора</p>
<input type="password" id="p-in" placeholder="••••••" style="text-align:center;font-size:18px;letter-spacing:4px">
<button type="button" class="btn btn-w" id="b-log">Войти</button>
<p id="err" style="color:#f87171;font-size:12px;text-align:center;margin-top:10px;display:none"></p>
</div>

<div id="v-adm" style="display:none">
<h2>Генератор NFC-карты</h2>
<p class="sub">Заполните нужные поля — пустые кнопки скроются</p>
<label>Название заведения *</label>
<input id="f-n" placeholder="Например: Кофейня Бодрость">
<label>Прямая ссылка на логотип (необязательно)</label>
<input id="f-img" placeholder="https://... (.jpg или .png)">
<label>Текст под названием</label>
<input id="f-s" value="Спасибо, что выбрали нас! Оцените сервис или подпишитесь">
<label>Отзывы Яндекс Карты (необязательно)</label>
<input id="f-ya" placeholder="https://yandex.ru...">
<label>Отзывы 2ГИС (необязательно)</label>
<input id="f-dg" placeholder="https://2gis.com...">
<label>Telegram (необязательно)</label>
<input id="f-tg" placeholder="https://t.me...">
<label>Instagram (необязательно)</label>
<input id="f-ig" placeholder="https://instagram.com...">
<button type="button" class="btn btn-w" id="b-gen">Создать короткую ссылку</button>
<div class="res" id="res">
<label style="color:#fff;margin-top:0;text-align:center">Готовая ссылка для NFC:</label>
<input id="out" readonly style="color:#7dd3fc;text-align:center;font-weight:700">
<button type="button" class="btn btn-b" id="b-cp">Скопировать ссылку</button>
<a class="btn btn-g" id="b-op" target="_blank">Посмотреть карточку клиента</a>
</div>
</div>

<div id="v-cli" style="display:none;text-align:center">
<div class="logo" id="c-logo"></div>
<h2 id="c-name"></h2>
<p class="sub" id="c-sub"></p>
<div id="c-btns"></div>
</div>
<div class="ft">NFC SMART SYSTEM</div>
</div>

<script>
var wm=document.getElementById('wm');
for(var i=0;i<320;i++){var s=document.createElement('span');s.textContent='NFC';wm.appendChild(s);}

var q=new URLSearchParams(location.search),cn=q.get('n');
if(cn){
document.getElementById('v-auth').style.display='none';
document.getElementById('v-cli').style.display='block';
document.title=cn;
document.getElementById('c-name').textContent=cn;
if(q.get('s'))document.getElementById('c-sub').textContent=q.get('s');
var lg=document.getElementById('c-logo'),im=q.get('img');
if(im){
var img=document.createElement('img');img.src=im;
img.onerror=function(){lg.textContent=cn.trim().slice(0,2).toUpperCase();};
lg.appendChild(img);
}else lg.textContent=cn.trim().slice(0,2).toUpperCase();

var box=document.getElementById('c-btns');
function addB(k,t,e,st,cl){
var u=q.get(k);if(!u||!u.trim())return;
var a=document.createElement('a');a.href=u;a.className='abtn '+cl;a.target='_blank';
var ic=document.createElement('div');ic.className='ico';ic.textContent=e;
var inf=document.createElement('div');
if(st){var sr=document.createElement('div');sr.className='stars';sr.textContent=st;inf.appendChild(sr);}
var lb=document.createElement('div');lb.className='lbl';lb.textContent=t;inf.appendChild(lb);
a.appendChild(ic);a.appendChild(inf);box.appendChild(a);
}
addB('ya','Отзыв на Яндекс Картах','📍','⭐⭐⭐⭐⭐','t-ya');
addB('dg','Оценить в 2ГИС','🗺️','⭐⭐⭐⭐⭐','t-dg');
addB('tg','Наш Telegram-канал','✈️','','t-tg');
addB('ig','Мы в Instagram','📸','','t-ig');
}else{
var fl=0,lk=0;
function chk(str){
var h1=0xdeadbeef,h2=0x41c6ce57,s='nfc2026_'+str;
for(var i=0;i<s.length;i++){
var ch=s.charCodeAt(i);
h1=Math.imul(h1^ch,2654435761);
h2=Math.imul(h2^ch,1597334677);
}
h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
var KEY='1177d326973bc2';
if(sessionStorage.getItem('ok')===KEY){
document.getElementById('v-auth').style.display='none';
document.getElementById('v-adm').style.display='block';
}
function login(){
var now=Date.now(),er=document.getElementById('err');
if(now<lk){er.textContent='Подождите '+Math.ceil((lk-now)/1000)+' сек.';er.style.display='block';return;}
var v=document.getElementById('p-in').value.trim();
if(chk(v)===KEY){
sessionStorage.setItem('ok',KEY);
document.getElementById('v-auth').style.display='none';
document.getElementById('v-adm').style.display='block';
}else{
fl++;if(fl>=5){lk=Date.now()+30000;fl=0;er.textContent='Блокировка на 30 сек.';}
else er.textContent='Неверный пароль! Попыток: '+(5-fl);
er.style.display='block';
}
}
document.getElementById('b-log').onclick=login;
document.getElementById('p-in').onkeyup=function(e){if(e.key==='Enter')login();};
}

function shrt(u,cb){
var d=false,c='c'+Math.floor(Math.random()*999999),t=setTimeout(function(){if(!d){d=true;cb(u);}},2500);
window[c]=function(r){if(d)return;d=true;clearTimeout(t);cb(r&&r.shorturl?r.shorturl:u);};
var s=document.createElement('script');
s.src='https://is.gd;
s.onerror=function(){if(!d){d=true;clearTimeout(t);cb(u);}};
document.body.appendChild(s);
}

document.getElementById('b-gen').onclick=function(){
var n=document.getElementById('f-n').value.trim();
if(!n)return alert('Введите название!');
var b=document.getElementById('b-gen');b.textContent='Создаём...';b.disabled=true;
var u=new URL(location.origin+location.pathname);u.searchParams.set('n',n);
var ks='img,s,ya,dg,tg,ig'.split(','),ids='f-img,f-s,f-ya,f-dg,f-tg,f-ig'.split(',');
for(var i=0;i<ks.length;i++){var v=document.getElementById(ids[i]).value.trim();if(v)u.searchParams.set(ks[i],v);}
shrt(u.toString(),function(res){
document.getElementById('out').value=res;
document.getElementById('b-op').href=res;
document.getElementById('res').style.display='block';
b.textContent='Создать короткую ссылку';b.disabled=false;
});
};

document.getElementById('b-cp').onclick=function(){
var i=document.getElementById('out');i.select();i.setSelectionRange(0,99999);
document.execCommand('copy');if(navigator.clipboard)navigator.clipboard.writeText(i.value);
alert('Скопировано!');
};
</script>
</body>
</html>
