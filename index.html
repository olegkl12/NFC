<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>NFC Smart System</title>
 <style>
 :root {
 --bg-start: #090b10;
 --bg-end: #1c2235;
 --card-bg: rgba(18, 22, 33, 0.76);
 --card-border: rgba(255, 255, 255, 0.14);
 --text-main: #ffffff;
 --text-muted: #b0b8c9;
 --accent: #3b82f6;
 --accent-hover: #2563eb;
 --input-bg: rgba(9, 11, 16, 0.65);
 }

 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 -webkit-tap-highlight-color: transparent;
 }

 html, body {
 width: 100%;
 min-height: 100vh;
 min-height: 100dvh;
 background: radial-gradient(circle at 50% 15%, var(--bg-end) 0%, var(--bg-start) 100%);
 color: var(--text-main);
 overflow-x: hidden;
 display: flex;
 align-items: center;
 justify-content: center;
 position: relative;
 }

 /* Р’РѕРґСЏРЅРѕР№ Р·РЅР°Рє NFC РЅР° РІРµСЃСЊ СЌРєСЂР°РЅ */
 .watermark-bg {
 position: fixed;
 inset: -10%;
 z-index: 0;
 pointer-events: none;
 фоновое изображение: url("данные: изображение/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg ' width='150' height='150' viewBox='0 0 150 150'%3E%3Ctext x='50%25' y='50%25' font-family='без засечек' font-weight='800' font-size='22' letter-spacing='2' fill='rgba(255,255,255,0.045)' text-anchor='middle' dominant-baseline='middle' transform='повернуть(-28 75 75)'%3ENFC%3C /текст%3E%3C/svg%3E");
 background-repeat: repeat;
 filter: blur(1.3px);
 }

 .container {
 position: relative;
 z-index: 1;
 width: 100%;
 max-width: 430px;
 padding: 20px 16px;
 margin: 0 auto;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 }

 /* РљР°СЂС‚РѕС‡РєР° С‚С‘РјРЅРѕРіРѕ РјР°С‚РѕРІРѕРіРѕ СЃС‚РµРєР»Р° */
 .glass-card {
 width: 100%;
 background: var(--card-bg);
 backdrop-filter: blur(22px);
 -webkit-backdrop-filter: blur(22px);
 border: 1px solid var(--card-border);
 border-radius: 28px;
 padding: 34px 22px 24px;
 box-shadow: 0 28px 60px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.12);
 display: flex;
 flex-direction: column;
 align-items: center;
 text-align: center;
 }

 .hidden {
 display: none !important;
 }

 /* --- Р Р•Р–РРњ Р“Р•РќР•Р РђРўРћР Рђ --- */
 .editor-title {
 font-size: 22px;
 font-weight: 700;
 margin-bottom: 6px;
 letter-spacing: -0.3px;
 }

 .editor-subtitle {
 font-size: 13px;
 color: var(--text-muted);
 margin-bottom: 22px;
 }

 .form-group {
 width: 100%;
 text-align: left;
 margin-bottom: 13px;
 }

 .form-group label {
 display: block;
 font-size: 11px;
 font-weight: 600;
 color: var(--text-muted);
 margin-bottom: 5px;
 text-transform: uppercase;
 letter-spacing: 0.5px;
 }

 .form-group input,
 .form-group textarea {
 width: 100%;
 background: var(--input-bg);
 border: 1px solid var(--card-border);
 border-radius: 12px;
 padding: 12px 14px;
 color: var(--text-main);
 font-size: 14px;
 outline: none;
 transition: border-color 0.2s, box-shadow 0.2s;
 }

 .form-group textarea {
 resize: vertical;
 min-height: 66px;
 }

 .form-group input:focus,
 .form-group textarea:focus {
 border-color: var(--accent);
 box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
 }

 .btn-primary {
 width: 100%;
 padding: 15px;
 border: none;
 border-radius: 14px;
 background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
 color: #fff;
 font-size: 15px;
 font-weight: 700;
 cursor: pointer;
 margin-top: 8px;
 box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
 transition: transform 0.15s, opacity 0.2s;
 }

 .btn-primary:active {
 transform: scale(0.98);
 }

 .btn-primary:disabled {
 opacity: 0.65;
 cursor: wait;
 }

 .result-box {
 width: 100%;
 margin-top: 20px;
 padding-top: 18px;
 border-top: 1px solid var(--card-border);
 display: flex;
 flex-direction: column;
 gap: 10px;
 }

 .result-label {
 font-size: 12px;
 color: var(--text-muted);
 text-align: left;
 }

 .result-url-input {
 width: 100%;
 background: rgba(0, 0, 0, 0.45);
 border: 1px solid var(--card-border);
 border-radius: 10px;
 padding: 10px 12px;
 color: #60a5fa;
 font-size: 13px;
 outline: none;
 word-break: break-all;
 }

 .result-actions {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 10px;
 }

 .btn-secondary {
 padding: 11px 10px;
 border-radius: 12px;
 border: 1px solid var(--card-border);
 background: rgba(255, 255, 255, 0.08);
 color: #fff;
 font-size: 12.5px;
 font-weight: 600;
 cursor: pointer;
 text-decoration: none;
 display: flex;
 align-items: center;
 justify-content: center;
 text-align: center;
 transition: background 0.2s;
 }

 .btn-secondary:hover {
 background: rgba(255, 255, 255, 0.14);
 }

 /* --- Р Р•Р–РРњ РљРђР РўРћР§РљР РљР›РР•РќРўРђ --- */
 .avatar-wrap {
 width: 96px;
 height: 96px;
 border-radius: 50%;
 margin-bottom: 18px;
 overflow: hidden;
 display: flex;
 align-items: center;
 justify-content: center;
 background: radial-gradient(circle at 30% 30%, #2a334a, #111521);
 border: 2.5px solid rgba(255, 255, 255, 0.22);
 box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
 flex-shrink: 0;
 }

 .avatar-wrap img {
 width: 100%;
 height: 100%;
 object-fit: cover;
 }

 .avatar-initials {
 font-size: 34px;
 font-weight: 800;
 letter-spacing: 1px;
 color: #ffffff;
 text-transform: uppercase;
 }

 .place-title {
 font-size: 25px;
 font-weight: 800;
 line-height: 1.25;
 margin-bottom: 8px;
 color: #ffffff;
 word-break: break-word;
 }

 .place-desc {
 font-size: 14px;
 line-height: 1.45;
 color: var(--text-muted);
 margin-bottom: 26px;
 max-width: 320px;
 word-break: break-word;
 }

 .links-stack {
 width: 100%;
 display: flex;
 flex-direction: column;
 gap: 13px;
 }

 /* РљРЅРѕРїРєРё РґРµР№СЃС‚РІРёР№ РІ СЃС‚РёР»Рµ РјР°РєРµС‚Р° */
 .action-btn {
 width: 100%;
 min-height: 62px;
 padding: 10px 16px;
 border-radius: 18px;
 text-decoration: none;
 display: flex;
 align-items: center;
 gap: 14px;
 position: relative;
 box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
 transition: transform 0.15s ease, filter 0.15s ease;
 }

 .action-btn:active {
 transform: scale(0.97);
 }

 .action-btn:hover {
 filter: brightness(1.05);
 }

 .btn-icon-circle {
 width: 42px;
 height: 42px;
 border-radius: 50%;
 background: #ffffff;
 display: flex;
 align-items: center;
 justify-content: center;
 font-size: 20px;
 flex-shrink: 0;
 box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
 }

 .btn-content {
 display: flex;
 flex-direction: column;
 align-items: flex-start;
 justify-content: center;
 text-align: left;
 flex: 1;
 min-width: 0;
 }

 .btn-stars {
 font-size: 12px;
 line-height: 1.1;
 letter-spacing: 1.5px;
 margin-bottom: 3px;
 }

 .btn-label {
 font-size: 15px;
 font-weight: 700;
 line-height: 1.2;
 word-break: break-word;
 }

 /* РРЅРґРёРІРёРґСѓР°Р»СЊРЅС‹Рµ РіСЂР°РґРёРµРЅС‚С‹ РєРЅРѕРїРѕРє */
 .btn-yandex {
 background: linear-gradient(135deg, #ffd426 0%, #ff9d00 100%);
 color: #141414;
 }

 .btn-2gis {
 background: linear-gradient(135deg, #34d058 0%, #169c38 100%);
 color: #ffffff;
 }

 .btn-tg {
 background: linear-gradient(135deg, #37aee2 0%, #1e88e5 100%);
 color: #ffffff;
 }

 .btn-ig {
 background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
 color: #ffffff;
 }

 .system-footer {
 margin-top: 28px;
 font-size: 10px;
 font-weight: 700;
 letter-spacing: 2.5px;
 color: rgba(255, 255, 255, 0.32);
 text-transform: uppercase;
 }
 </style>
</head>
<body>

 <div class="watermark-bg"></div>

 <main class="container">
 <!-- Р Р•Р–РРњ 1: Р“Р•РќР•Р РђРўРћР -->
 <section id="editor-view" class="glass-card hidden">
 <h1 class="editor-title">Р“РµРЅРµСЂР°С‚РѕСЂ NFC-РІРёР·РёС‚РєРё</h1>
 <p class="editor-subtitle">Р—Р°РїРѕР»РЅРёС‚Рµ РґР°РЅРЅС‹Рµ Р·Р°РІРµРґРµРЅРёСЏ РґР»СЏ NFC-РјРµС‚РєРё</p>

 <form id="nfc-form" style="width: 100%;">
 <div class="form-group">
 <label for="f-name">РќР°Р·РІР°РЅРёРµ Р·Р°РІРµРґРµРЅРёСЏ *</label>
 <input type="text" id="f-name" placeholder="РќР°РїСЂРёРјРµСЂ: РљРѕС„РµР№РЅСЏ Р‘РѕРґСЂРѕСЃС‚СЊ" required>
 </div>

 <div class="form-group">
 <label for="f-logo">РџСЂСЏРјР°СЏ СЃСЃС‹Р»РєР° РЅР° С„РѕС‚Рѕ Р»РѕРіРѕС‚РёРїР° (.jpg / .png)</label>
 <input type="url" id="f-logo" placeholder="https://example.com/logo.png">
 </div>

 <div class="form-group">
 <label for="f-desc">РўРµРєСЃС‚ РїРѕРґ РЅР°Р·РІР°РЅРёРµРј</label>
 <textarea id="f-desc">РЎРїР°СЃРёР±Рѕ, С‡С‚Рѕ РІС‹Р±СЂР°Р»Рё РЅР°СЃ! РћСЃС‚Р°РІСЊС‚Рµ РѕС‚Р·С‹РІ РёР»Рё РїРѕРґРїРёС€РёС‚РµСЃСЊ</textarea>
 </div>

 <div class="form-group">
 <label for="f-ya">РЎСЃС‹Р»РєР° РЅР° РЇРЅРґРµРєСЃ РљР°СЂС‚С‹</label>
 <input type="url" id="f-ya" placeholder="https://yandex.ru/maps/...">
 </div>

 <div class="form-group">
 <label for="f-gis">РЎСЃС‹Р»РєР° РЅР° 2Р“РРЎ</label>
 <input type="url" id="f-gis" placeholder="https://2gis.ru/...">
 </div>

 <div class="form-group">
 <label for="f-tg">РЎСЃС‹Р»РєР° РЅР° Telegram</label>
 <input type="url" id="f-tg" placeholder="https://t.me/...">
 </div>

 <div class="form-group">
 <label for="f-ig">РЎСЃС‹Р»РєР° РЅР° Instagram</label>
 <input type="url" id="f-ig" placeholder="https://instagram.com/...">
 </div>

 <button type="submit" id="generate-btn" class="btn-primary">РЎРѕР·РґР°С‚СЊ РєРѕСЂРѕС‚РєСѓСЋ СЃСЃС‹Р»РєСѓ</button>
 </form>

 <div id="result-box" class="result-box hidden">
 <div class="result-label" id="result-status">Р“РѕС‚РѕРІР°СЏ СЃСЃС‹Р»РєР° РґР»СЏ NFC-РјРµС‚РєРё:</div>
 <input type="text" id="result-url" class="result-url-input" readonly>
 <div class="result-actions">
 <button type="button" id="copy-btn" class="btn-secondary">РЎРєРѕРїРёСЂРѕРІР°С‚СЊ СЃСЃС‹Р»РєСѓ</button>
 <a id="open-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-secondary">РџРѕСЃРјРѕС‚СЂРµС‚СЊ РєР°СЂС‚РѕС‡РєСѓ РєР»РёРµРЅС‚Р°</a>
 </div>
 </div>

 <div class="system-footer">NFC SMART SYSTEM</div>
 </section>

 <!-- Р Р•Р–РРњ 2: РљРђР РўРћР§РљРђ РљР›РР•РќРўРђ -->
 <section id="client-view" class="glass-card hidden">
 <div class="avatar-wrap" id="c-avatar"></div>
 <h1 class="place-title" id="c-name"></h1>
 <p class="place-desc" id="c-desc"></p>
 <div class="links-stack" id="c-links"></div>
 <div class="system-footer">NFC SMART SYSTEM</div>
 </section>
 </main>

 <script>
 (function () {
 const DEFAULT_DESC = 'РЎРїР°СЃРёР±Рѕ, С‡С‚Рѕ РІС‹Р±СЂР°Р»Рё РЅР°СЃ! РћСЃС‚Р°РІСЊС‚Рµ РѕС‚Р·С‹РІ РёР»Рё РїРѕРґРїРёС€РёС‚РµСЃСЊ';
 const params = new URLSearchParams(window.location.search);
 const placeName = params.get('n');

 if (placeName && placeName.trim() !== '') {
 renderClientCard(params);
 } else {
 initEditor();
 }

 function normalizeUrl(raw) {
 if (!raw) return '';
 const trimmed = raw.trim();
 if (!trimmed) return '';
 return /^https?:\/\//i.test(trimmed) ? trimmed : 'https://' + trimmed;
 }

 function getInitials(name) {
 const clean = name.trim().replace(/["'В«В»]/g, '');
 const words = clean.split(/\s+/).filter(Boolean);
 if (words.length >= 2) {
 return (words[0][0] + words[1][0]).toUpperCase();
 }
 return clean.slice(0, 2).toUpperCase() || 'NF';
 }

 function renderClientCard(p) {
 document.getElementById('client-view').classList.remove('hidden');

 const name = p.get('n').trim();
 const logo = normalizeUrl(p.get('l'));
 const desc = p.has('d') ? p.get('d').trim() : DEFAULT_DESC;

 document.title = name;
 document.getElementById('c-name').textContent = name;

 const descEl = document.getElementById('c-desc');
 if (desc) {
 descEl.textContent = desc;
 } else {
 descEl.classList.add('hidden');
 }

 const avatarEl = document.getElementById('c-avatar');
 if (logo) {
 const img = document.createElement('img');
 img.src = logo;
 img.alt = name;
 img.onerror = function () {
 avatarEl.innerHTML = `<span class="avatar-initials">${getInitials(name)}</span>`;
 };
 avatarEl.appendChild(img);
 } else {
 avatarEl.innerHTML = `<span class="avatar-initials">${getInitials(name)}</span>`;
 }

 const buttonsConfig = [
 {
 key: 'ya',
 icon: 'рџ“Ќ',
 stars: 'вђвђвђвђвђ',
 label: 'РћС‚Р·С‹РІ РЅР° РЇРЅРґРµРєСЃ РљР°СЂС‚Р°С…',
 cls: 'btn-yandex'
 },
 {
 key: 'gis',
 icon: 'рџ—єпёЏ',
 stars: 'вђвђвђвђвђ',
 label: 'РћС†РµРЅРёС‚СЊ РІ 2Р“РРЎ',
 cls: 'btn-2gis'
 },
 {
 key: 'tg',
 icon: 'вњ€пёЏ',
 stars: '',
 label: 'РќР°С€ Telegram-РєР°РЅР°Р»',
 cls: 'btn-tg'
 },
 {
 key: 'ig',
 icon: 'рџ“ё',
 stars: '',
 label: 'РњС‹ РІ Instagram',
 cls: 'btn-ig'
 }
 ];

 const linksContainer = document.getElementById('c-links');
 buttonsConfig.forEach(item => {
 const url = normalizeUrl(p.get(item.key));
 if (url) {
 const a = document.createElement('a');
 a.href = url;
 a.target = '_blank';
 a.rel = 'noopener noreferrer';
 a.className = `action-btn ${item.cls}`;

 const starsHtml = item.stars ? `<span class="btn-stars">${item.stars}</span>` : '';
 a.innerHTML = `
 <span class="btn-icon-circle">${item.icon}</span>
 <span class="btn-content">
 ${starsHtml}
 <span class="btn-label">${item.label}</span>
 </span>
 `;
 linksContainer.appendChild(a);
 }
 });
 }

 function initEditor() {
 document.getElementById('editor-view').classList.remove('hidden');

 const form = document.getElementById('nfc-form');
 const genBtn = document.getElementById('generate-btn');
 const resultBox = document.getElementById('result-box');
 const resultUrlInput = document.getElementById('result-url');
 const resultStatus = document.getElementById('result-status');
 const copyBtn = document.getElementById('copy-btn');
 const openBtn = document.getElementById('open-btn');

 form.addEventListener('submit', async function (e) {
 e.preventDefault();

 const name = document.getElementById('f-name').value.trim();
 if (!name) return;

 const outParams = new URLSearchParams();
 outParams.set('n', name);

 const logo = document.getElementById('f-logo').value.trim();
 const desc = document.getElementById('f-desc').value.trim();
 const ya = document.getElementById('f-ya').value.trim();
 const gis = document.getElementById('f-gis').value.trim();
 const tg = document.getElementById('f-tg').value.trim();
 const ig = document.getElementById('f-ig').value.trim();

 if (logo) outParams.set('l', logo);
 if (desc && desc !== DEFAULT_DESC) outParams.set('d', desc);
 if (ya) outParams.set('ya', ya);
 if (gis) outParams.set('gis', gis);
 if (tg) outParams.set('tg', tg);
 if (ig) outParams.set('ig', ig);

 const baseUrl = window.location.origin + window.местоположение.pathname;
 const longUrl = `${baseUrl}?${outParams.toString()}`;

 genBtn.disabled = true;
 genBtn.textContent = 'РЎРѕР·РґР°РЅРёРµ СЃСЃС‹Р»РєРё...';

 const finalUrl = await shortenWithIsGd(longUrl);

 genBtn.disabled = false;
 genBtn.textContent = 'РЎРѕР·РґР°С‚СЊ РєРѕСЂРѕС‚РєСѓСЋ СЃСЃС‹Р»РєСѓ';

 resultUrlInput.value = finalUrl;
 openBtn.href = finalUrl;
 resultStatus.textContent = finalUrl === longUrl
 ? 'Р“РѕС‚РѕРІР°СЏ СЂР°Р±РѕС‡Р°СЏ СЃСЃС‹Р»РєР°:'
 : 'РљРѕСЂРѕС‚РєР°СЏ СЃСЃС‹Р»РєР° РґР»СЏ NFC-РјРµС‚РєРё РіРѕС‚РѕРІР°:';

 resultBox.classList.remove('hidden');
 copyBtn.textContent = 'РЎРєРѕРїРёСЂРѕРІР°С‚СЊ СЃСЃС‹Р»РєСѓ';
 });

 copyBtn.addEventListener('click', function () {
 resultUrlInput.select();
 resultUrlInput.setSelectionRange(0, 99999);
 navigator.clipboard.writeText(resultUrlInput.value).then(() => {
 copyBtn.textContent = 'РЎРєРѕРїРёСЂРѕРІР°РЅРѕ!';
 setTimeout(() => {
 copyBtn.textContent = 'РЎРєРѕРїРёСЂРѕРІР°С‚СЊ СЃСЃС‹Р»РєСѓ';
 }, 2000);
 });
 });
 }

 асинхронная функция shortenWithIsGd(longUrl) {
 if (!/^https?:\/\//i.test(longUrl) || ['localhost', '127.0.0.1'].includes(window.местоположение.hostname)) {
 return longUrl;
 }

 const controller = new AbortController();
 const timeoutId = setTimeout(() => controller.abort(), 2500);

 try {
 const response = await fetch(`https://is.gd/create.php?format=simple&url=${encodeURIComponent(longUrl)}`, {
 signal: controller.signal
 });
 clearTimeout(timeoutId);
 if (response.ok) {
 const shortText = (await response.text()).trim();
 if (shortText.startsWith('http')) {
 return shortText;
 }
 }
 } catch (err) {
 clearTimeout(timeoutId);
 }

 return longUrl;
 }
 })();
 </script>
</body>
</html>
