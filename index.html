<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NFC Smart System</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    background: #0b0d12;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
    position: relative;
  }
  #bg-nfc {
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    align-content: center;
    justify-items: center;
    gap: 24px 16px;
    transform: rotate(-25deg);
    pointer-events: none;
    z-index: 0;
    user-select: none;
    filter: blur(1.5px);
  }
  .wm {
    font-size: 22px;
    font-weight: 900;
    color: rgba(255, 255, 255, 0.055);
    letter-spacing: 3px;
  }
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 390px;
    background: rgba(24, 27, 34, 0.93);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 26px;
    padding: 28px 22px;
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  h2 {
    font-size: 21px;
    text-align: center;
    margin-bottom: 6px;
  }
  .sub {
    font-size: 13px;
    color: #9ca3af;
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.4;
  }
  label {
    display: block;
    font-size: 12px;
    color: #9ca3af;
    margin: 11px 0 4px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #353b47;
    background: #0f1115;
    color: #ffffff;
    font-size: 14px;
    outline: none;
  }
  input:focus {
    border-color: #24A1DE;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 16px;
    margin-top: 12px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-white { background: #ffffff; color: #000000; margin-top: 18px; }
  .btn-blue { background: #24A1DE; color: #ffffff; }
  .btn-gray { background: #2e333d; color: #ffffff; }
  .btn-ya { background: #ffcc00; color: #000000; }
  .btn-2g { background: #2ab930; color: #ffffff; }
  .btn-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #ffffff; }
  .logo-circle {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: #2b303b;
    margin: 0 auto 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    font-weight: 700;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.2);
  }
  .logo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .res-box {
    margin-top: 18px;
    padding: 14px;
    background: #14222e;
    border: 1px solid #24A1DE;
    border-radius: 14px;
    display: none;
  }
  .footer {
    margin-top: 22px;
    text-align: center;
    font-size: 11px;
    color: #5c6270;
    letter-spacing: 0.5px;
  }
</style>
</head>
