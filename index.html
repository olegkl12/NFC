<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Smart Card</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f1115; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 420px; background: #1a1d24; border: 1px solid #2e333d; border-radius: 24px; padding: 28px 22px; }
        .client-view { text-align: center; display: none; }
        .logo-circle { width: 76px; height: 76px; background: #2b303b; border-radius: 50%; margin: 0 auto 16px; display: flex; justify-content: center; align-items: center; font-size: 26px; font-weight: 700; text-transform: uppercase; }
        h1 { font-size: 22px; margin-bottom: 8px; }
        p.subtitle { font-size: 14px; color: #a0a6b5; margin-bottom: 24px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn { display: flex; align-items: center; justify-content: center; padding: 15px 20px; border-radius: 14px; text-decoration: none; font-size: 15px; font-weight: 600; border: none; cursor: pointer; width: 100%; }
        .btn-yandex { background: #ffcc00; color: #111111; }
        .btn-2gis { background: #2ab930; color: #ffffff; }
        .btn-tg { background: #24A1DE; color: #ffffff; }
        .btn-inst { background: #dc2743; color: #ffffff; }
        .admin-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; text-align: center; }
        .admin-desc { font-size: 13px; color: #a0a6b5; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; color: #a0a6b5; margin-bottom: 5px; }
        input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #353b47; background: #0f1115; color: #fff; font-size: 14px; }
        .btn-generate { background: #ffffff; color: #0f1115; margin-top: 8px; }
        .result-box { margin-top: 20px; padding: 14px; background: #14222e; border: 1px solid #24A1DE; border-radius: 14px; display: none; }
        .result-link { width: 100%; background: #0f1115; color: #7dd3fc; font-size: 12px; padding: 10px; border-radius: 8px; border: none; margin-bottom: 10px; }
        .btn-copy { background: #24A1DE; color: #fff; padding: 10px; font-size: 13px; margin-bottom: 8px; }
        .btn-preview { background: #2e333d; color: #fff; padding: 10px; font-size: 13px; }
        .footer { margin-top: 24px; font-size: 11px; color: #5c6270; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="adminView">
        <div class="admin-title">Генератор NFC-карты</div>
        <div class="admin-desc">Заполните данные клиента — ссылка создастся мгновенно</div>

        <div class="input-group">
            <label>Название заведения *</label>
            <input type="text" id="inName" placeholder="Например: Кофейня Бодрость">
        </div>
        <div class="input-group">
            <label>Текст под названием</label>
            <input type="text" id="inSub" value="Спасибо, что выбрали нас! Оставьте отзыв или подпишитесь">
        </div>
        <div class="input-group">
            <label>Ссылка на отзывы Яндекс Карты</label>
            <input type="url" id="inYa" placeholder="https://yandex.ru...">
        </div>
        <div class="input-group">
            <label>Ссылка на отзывы 2ГИС</label>
            <input type="url" id="in2gis" placeholder="https://2gis.ru...">
        </div>
        <div class="input-group">
            <label>Ссылка на Telegram</label>
            <input type="url" id="inTg" placeholder="https://t.me...">
        </div>
        <div class="input-group">
            <label>Ссылка на Instagram</label>
            <input type="url" id="inInst" placeholder="https://instagram.com...">
        </div>

        <button class="btn btn-generate" onclick=


nerateLink()">Создать персональную ссылку</button>

        <div id="resultBox" class="result-box">
            <label style="color: #fff;">Готовая ссылка для прошивки в NFC:</label>
            <input type="text" id="finalUrl" class="result-link" readonly>
            <button class="btn btn-copy" onclick="copyLink()">Скопировать ссылку</button>
            <button class="btn btn-preview" onclick="openPreview()">Посмотреть как выглядит у клиента</button>
        </div>
    </div>

    <div id="clientView" class="client-view">
        <div class="logo-circle" id="outLogo">NFC</div>
        <h1 id="outName">Название заведения</h1>
        <p class="subtitle" id="outSub">Спасибо, что выбрали нас!</p>
        <div class="links" id="outLinks"></div>
    </div>

    <div class="footer">NFC Smart System</div>
</div>

<script>
    var params = new URLSearchParams(window.location.search);
    var clientName = params.get('n');

    if (clientName) {
        document.getElementById('adminView').style.display = 'none';
        document.getElementById('clientView').style.display = 'block';
        document.title = clientName;
        document.getElementById('outName').textContent = clientName;
        
        var words = clientName.trim().split(' ');
        var initials = words.at(0) ? words.at(0).charAt(0) : 'N';
        if (words.length > 1 && words.at(1)) {
            initials += words.at(1).charAt(0);
        }
        document.getElementById('outLogo').textContent = initials;

        var sub = params.get('s');
        if (sub) document.getElementById('outSub').textContent = sub;

        var linksContainer = document.getElementById('outLinks');
        function addBtn(url, text, cls) {
            if (!url) return;
            var a = document.createElement('a');
            a.href = url;
            a.className = 'btn ' + cls;
            a.target = '_blank';
            a.textContent = text;
            linksContainer.appendChild(a);
        }

        addBtn(params.get('ya'), '★ Оставить отзыв в Яндекс Картах', 'btn-yandex');
        addBtn(params.get('dg'), '★ Оценить нас в 2ГИС', 'btn-2gis');
        addBtn(params.get('tg'), 'Наш Telegram-канал', 'btn-tg');
        addBtn(params.get('ig'), 'Наш Instagram', 'btn-inst');
    }

    function generateLink() {
        var name = document.getElementById('inName').value.trim();
        if (!name) {
            alert('Введите название заведения!');
            return;
        }
        var baseUrl = window.location.href.split('?').at(0);
        var url = new URL(baseUrl);
        url.searchParams.set('n', name);
        
        var sub = document.getElementById('inSub').value.trim();
        if (sub) url.searchParams.set('s', sub);

        var ya = document.getElementById('inYa').value.trim();
        if (ya) url.searchParams.set('ya', ya);

        var dg = document.getElementById('in2gis').value.trim();
        if (dg) url.searchParams.set('dg', dg);

        var tg = document.getElementById('inTg').value.trim();
        if (tg) url.searchParams.set('tg', tg);

        var ig = document.getElementById('inInst').value.trim();
        if (ig) url.searchParams.set('ig', ig);

        document.getElementById('finalUrl').value = url.toString();
        document.getElementById('resultBox').style.display = 'block';
    }

    function copyLink() {
        var copyText = document.getElementById('finalUrl');
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert('Ссылка скопирована!');
    }

    function openPreview() {
        var link = document.getElementById('finalUrl').value;
        window.open(link, '_blank');
    }
</script>

</body>
</html>"ge
