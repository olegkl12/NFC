<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC Smart System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle at top right, #1e2538, #090b10 75%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
        }
        .bg-pattern {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 45px 60px;
            transform: rotate(-28deg);
            pointer-events: none;
            z-index: 0;
            user-select: none;
            filter: blur(3px);
            opacity: 0.07;
        }
        .bg-pattern span {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 390px;
            margin: 0 auto;
            background: rgba(24, 27, 34, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 28px;
            padding: 32px 22px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .client-view {
            display: none;
            text-align: center;
        }
        .logo-wrapper {
            width: 84px;
            height: 84px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2d3446, #181b24);
            border: 2px solid rgba(255, 255, 255, 0.18);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }
        .logo-initials {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.25;
            word-wrap: break-word;
        }
        p.subtitle {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 26px;
            line-height: 1.45;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 18px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
            line-height: 1.3;
            transition: transform 0.15s ease;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-yandex { background: #ffcc00; color: #111111; }
        .btn-2gis { background: #2ab930; color: #ffffff; }
        .btn-tg { background: #24A1DE; color: #ffffff; }

    </div>

    <div id="clientView" class="client-view">
        <div class="logo-wrapper">
            <span class="logo-initials" id="outLogoText">NFC</span>
            <img class="logo-img" id="outLogoImg" alt="Logo">
        </div>
        <h1 id="outName">Название заведения</h1>
        <p class="subtitle" id="outSub">Спасибо, что выбрали нас!</p>
        <div class="links" id="outLinks"></div>
    </div>

    <div class="footer">NFC SMART SYSTEM</div>
</div>

<div class="bg-pattern" id="bgPattern"></div>

<div class="container">
    <!-- РЕДАКТОР ОТКРЫТ СРАЗУ БЕЗ ПАРОЛЯ -->
    <div id="adminView">
        <div class="admin-title">Генератор NFC-карты</div>
        <div class="admin-desc">Заполните нужные поля — пустые кнопки скроются</div>

        <div class="input-group">
            <label>Название заведения *</label>
            <input type="text" id="inName" placeholder="Например: BREND SHOP">
        </div>
        <div class="input-group">
            <label>Прямая ссылка на фото логотипа (.jpg / .png)</label>
            <input type="text" id="inLogo" placeholder="Оставьте пустым для красивых букв">
        </div>
        <div class="input-group">
            <label>Текст под названием</label>
            <input type="text" id="inSub" value="Спасибо, что выбрали нас! Оставьте отзыв или подпишитесь">
        </div>
        <div class="input-group">
            <label>Отзывы Яндекс Карты (необязательно)</label>
            <input type="text" id="inYa" placeholder="https://yandex.ru...">
        </div>
        <div class="input-group">
            <label>Отзывы 2ГИС (необязательно)</label>
            <input type="text" id="in2gis" placeholder="https://2gis.com...">
        </div>
        <div class="input-group">
            <label>Telegram (необязательно)</label>
            <input type="text" id="inTg" placeholder="https://t.me...">
        </div>
        <div class="input-group">
            <label>Instagram (необязательно)</label>
            <input type="text" id="inInst" placeholder="https://instagram.com...">
        </div>

        <button type="button" class="btn btn-generate" id="genBtn">Создать ссылку</button>

        <div id="resultBox" class="result-box">
            <label style="color: #fff; text-align: center; margin-bottom: 8px;">Готовая ссылка для NFC-метки:</label>
            <input type="text" id="finalUrl" class="result-link" readonly>
            <button type="button" class="btn btn-copy" id="btnCopy">
